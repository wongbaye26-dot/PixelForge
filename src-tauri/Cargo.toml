[package]
name = "pixel-forge"
version = "0.1.0"
description = "PixelForge - local batch image processing"
edition = "2021"

[lib]
name = "pixel_forge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
